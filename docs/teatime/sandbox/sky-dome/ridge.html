<!doctype html><html><head><meta charset="utf-8"><title>ridge</title></head><body>
<canvas id="c"></canvas>
<script>
(async () => {
  const q = new URLSearchParams(location.search); const CFGN = q.get('cfg') || 'ridge_cfg.json';
  const CFG = await (await fetch(CFGN)).json(); const META = await (await fetch(CFG.dem_meta)).json();
  const Z = META.z, X0 = META.x0, Y0 = META.y0, N = META.n, TS = 256, RE = 6371000, d2r = Math.PI/180, r2d = 180/Math.PI;
  const OBS = CFG.obs; const EYE = CFG.eye || 1.5; const K = CFG.k ?? 0.13; const REFF = RE/(1-K);
  const STEP_AZ = CFG.stepAz || 0.2, DMAX = CFG.dmax || 150000, STEP_D = CFG.stepD || 100;
  const c = document.getElementById('c'); c.width = N*TS; c.height = N*TS; const g = c.getContext('2d', { willReadFrequently: true });
  let loaded = 0, missing = [];
  await Promise.all([...Array(N*N).keys()].map(i => new Promise(res => { const tx = X0 + (i % N), ty = Y0 + Math.floor(i / N); const im = new Image();
    im.onload = () => { g.drawImage(im, (i%N)*TS, Math.floor(i/N)*TS); loaded++; res(); }; im.onerror = () => { missing.push([tx,ty]); res(); }; im.src = `${CFG.demdir}/dem_${Z}_${tx}_${ty}.png`; })));
  const data = g.getImageData(0, 0, c.width, c.height).data;
  const n = Math.pow(2, Z);
  const toPix = (lat, lon) => { const x = (lon+180)/360*n*TS - X0*TS; const phi = lat*d2r; const y = (1 - Math.log(Math.tan(phi) + 1/Math.cos(phi))/Math.PI)/2*n*TS - Y0*TS; return [x, y]; };
  const hAt = (xx, yy) => { if (xx<0||yy<0||xx>=c.width||yy>=c.height) return 0; const k = (yy*c.width+xx)*4; const r=data[k], gg=data[k+1], b=data[k+2]; if (data[k+3] === 0) return 0; let v = r*65536 + gg*256 + b; if (v === 8388608) return 0; if (v > 8388608) v -= 16777216; return v*0.01; };
  const elev = (lat, lon) => { const [x, y] = toPix(lat, lon); const x0 = Math.floor(x), y0 = Math.floor(y), fx = x-x0, fy = y-y0; return hAt(x0,y0)*(1-fx)*(1-fy) + hAt(x0+1,y0)*fx*(1-fy) + hAt(x0,y0+1)*(1-fx)*fy + hAt(x0+1,y0+1)*fx*fy; };
  const dest = (lat, lon, brg, dist) => { const φ1 = lat*d2r, λ1 = lon*d2r, δ = dist/RE, θ = brg*d2r; const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ)+Math.cos(φ1)*Math.sin(δ)*Math.cos(θ)); const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2)); return [φ2*r2d, λ2*r2d]; };
  const h0 = (OBS.h ?? elev(OBS.lat, OBS.lon)) + EYE; const demH0 = elev(OBS.lat, OBS.lon);
  const az = [], el = [], dist = [], top = [];
  for (let a = 0; a < 360; a += STEP_AZ) {
    let best = -90, bd = 0, bh = 0;
    for (let d = STEP_D; d <= DMAX; d += STEP_D) {
      const [la, lo] = dest(OBS.lat, OBS.lon, a, d); const h = elev(la, lo);
      const e = Math.atan2(h - h0, d)*r2d - (d/(2*REFF))*r2d;
      if (e > best) { best = e; bd = d; bh = h; }
    }
    az.push(+a.toFixed(2)); el.push(+best.toFixed(3)); dist.push(Math.round(bd)); top.push(Math.round(bh));
  }
  window.__ridge = { obs: OBS, eye: EYE, k: K, h0, demH0, stepAz: STEP_AZ, dmax: DMAX, stepD: STEP_D, tiles: { z: Z, loaded, missing }, az, el, dist, top, source: '国土地理院 標高タイル(dem_png, zoom ' + Z + ')' };
  window.__done = true;
})().catch(e => { window.__err = String(e && e.stack || e); window.__done = true; });
</script></body></html>
