<?xml version="1.0" encoding="UTF-8"?>
<!-- 宙の辻のロゴ(第186: 図形で描き直し。元は Inkscape の埋め込み PNG 378px)。
     正方形 S=1000 の中に、円(日)と三角(山)。
     ・三角: 底辺は正方形の下辺の左端から中点まで(0,S)-(S/2,S)、頂点は右上の角 (S,0)。
     ・円: 正方形の中点からの垂線 x=S/2 に接し、上辺 y=0 と三角の長辺(対角線 x+y=S)にも接する。
       半径 r = (S/2)/(2+√2) ≈ 146.447、中心 (S/2+r, r)。
     ・色: どちらも下が赤 #ff0000、上が橙 #ee7800 の縦のグラデーション(図形ごと)。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="sora-tri" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#ee7800"/>
    </linearGradient>
    <linearGradient id="sora-sun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#ee7800"/>
    </linearGradient>
  </defs>
  <polygon points="0,1000 500,1000 1000,0" fill="url(#sora-tri)"/>
  <circle cx="646.447" cy="146.447" r="146.447" fill="url(#sora-sun)"/>
</svg>
